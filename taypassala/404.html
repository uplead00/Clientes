<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Página não encontrada — Taynara Passala</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="favicon.ico?v=2" sizes="any" />
    <link rel="icon" href="assets/images/brand/icon.svg?v=2" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Montserrat:wght@500;600;700&family=Lato:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root{
        --night:#2a3744; --night-deep:#1c2630; --blue:#5e7389;
        --bronze:#b8965a; --bronze-hover:#9e7d47; --warm-white:#f6f4f0; --beige:#cdd4dc;
      }
      *{margin:0;padding:0;box-sizing:border-box}
      body{
        font-family:'Lato',sans-serif;min-height:100vh;min-height:100svh;
        display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
        color:var(--warm-white);
        background:radial-gradient(120% 90% at 70% 15%,#33424f 0%,transparent 55%),linear-gradient(160deg,var(--night) 0%,var(--night-deep) 100%);
      }
      .box{max-width:540px}
      .code{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(96px,24vw,180px);line-height:1;color:#fff}
      .code span{color:var(--bronze)}
      h1{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;font-size:clamp(24px,5vw,36px);margin:4px 0 16px;color:#fff}
      p{color:var(--beige);font-size:16px;line-height:1.7;margin-bottom:34px}
      .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
      .btn{display:inline-flex;align-items:center;justify-content:center;font-family:'Montserrat',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;padding:15px 32px;border-radius:4px;border:1px solid transparent;transition:all .3s ease;text-decoration:none;min-height:48px}
      .btn-primary{background:var(--bronze);color:#20272f}
      .btn-primary:hover{background:var(--bronze-hover)}
      .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
      .btn-ghost:hover{background:rgba(255,255,255,.1)}
      @media(max-width:520px){.actions{flex-direction:column}.btn{width:100%}}
    </style>
  </head>
  <body>
    <div class="box">
      <div class="code">4<span>0</span>4</div>
      <h1>Página não encontrada.</h1>
      <p>O link que você acessou não existe ou foi movido. Vamos voltar ao caminho certo?</p>
      <div class="actions">
        <a href="/" class="btn btn-primary">Voltar ao início</a>
        <a href="https://wa.me/5545999921321?text=Ol%C3%A1%20Taynara!%20Vim%20pelo%20site%20e%20quero%20saber%20mais%20sobre%20a%20consultoria." class="btn btn-ghost" target="_blank" rel="noopener">Falar no WhatsApp</a>
      </div>
    </div>
  </body>
</html>
